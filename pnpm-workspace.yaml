allowBuilds:
  # postinstall only downloads a native binary as a fallback; pnpm already installs
  # the platform binding (@unrs/resolver-binding-*) as an optional dependency.
  unrs-resolver: false

# node_modules here is a junction to E:/my-portfolio/node_modules (see next.config.ts), which pnpm can't
# install into; skip its install-before-run check so scripts (pnpm build / dev) run against the linked deps.
verifyDepsBeforeRun: false
